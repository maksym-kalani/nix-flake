name: ci

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # public repo on a self-hosted runner: never run fork PR code on it
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Format
        run: nix fmt -- --ci
      - name: Secrets are sops-encrypted
        run: |
          for f in secrets/secrets.yaml tests/aigis/secrets.yaml; do
            nix run --inputs-from . nixpkgs#yq-go -- -e \
              'del(.sops) | [.. | select(kind == "scalar")] | all_c(tag == "!!str" and test("^ENC\["))' "$f" \
              || { echo "::error file=$f::unencrypted value"; exit 1; }
          done

  eval:
    needs: lint
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    outputs:
      aigis_changed: ${{ steps.aigis.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Eval hosts and homes
        run: |
          for o in \
            nixosConfigurations.aigis.config.system.build.toplevel \
            nixosConfigurations.belial.config.system.build.toplevel \
            'homeConfigurations."maksym@aigis".activationPackage' \
            'homeConfigurations."maksym@belial".activationPackage'; do
            echo "::group::$o"
            nix eval --raw ".#$o.drvPath"
            echo "::endgroup::"
          done
      # after the evals: --no-build cannot fetch sources that are read during eval
      - run: nix flake check --no-build
      - name: Compare Aigis with PR base
        id: aigis
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="git+file://$GITHUB_WORKSPACE?rev=$BASE_SHA"
            candidate="git+file://$GITHUB_WORKSPACE?rev=$GITHUB_SHA"
            changed=$(bash .github/scripts/aigis-changed.sh "$base" "$candidate")
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  aigis-vm:
    needs: [lint, eval]
    if: needs.eval.outputs.aigis_changed == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: nix build -L --no-link .#checks.x86_64-linux.aigis-vm
