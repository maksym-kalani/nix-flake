name: Pi harness
on:
  pull_request:
    paths:
      - 'pkgs/pi-harness/**'
      - 'home/features/pi-harness/**'
      - 'home/features/ai/default.nix'
      - 'home/maksym/belial.nix'
      - 'tests/pi/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'pkgs/default.nix'
      - '.github/workflows/pi-harness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix build --no-link -L .#pi-harness .#pi-runtime .#pi-addons .#pi-skills .#checks.x86_64-linux.pi-harness .#checks.x86_64-linux.pi-home-manager .#checks.x86_64-linux.pi-api
      - run: nix eval --raw .#nixosConfigurations.belial.config.home-manager.users.maksym.home.activationPackage.drvPath
      - run: nix eval --raw .#nixosConfigurations.aigis.config.system.build.toplevel.drvPath
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Real NixOS VM namespaces and access-negative checks
        run: nix build --no-link -L .#checks.x86_64-linux.pi-sandbox-vm
