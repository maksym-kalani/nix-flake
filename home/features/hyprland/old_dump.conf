# =============================================================================
# HYPRLAND CONFIGURATION DUMP
# Extracted from ML4W dotfiles for NixOS Home Manager migration
# =============================================================================
#
# REQUIRED PACKAGES:
# ------------------
# Core Hyprland:
#   - hyprland
#   - hyprlock
#   - hypridle
#   - hyprpaper
#   - xdg-desktop-portal-hyprland
#
# Status Bar & Notifications:
#   - waybar
#   - swaynotificationcenter (swaync)
#
# Launchers & Menus:
#   - rofi-wayland
#   - wlogout
#
# Clipboard:
#   - cliphist
#   - wl-clipboard
#
# Authentication:
#   - polkit-gnome
#
# System Controls:
#   - brightnessctl
#   - playerctl
#   - wireplumber (wpctl)
#   - pulseaudio (pactl) or pipewire-pulse
#
# Screenshots:
#   - grim
#   - slurp
#   - swappy (optional, for annotation)
#
# Wallpaper:
#   - waypaper
#   - imagemagick (for blur effects)
#
# Display Effects:
#   - hyprshade (optional)
#
# Settings & Configuration:
#   - nwg-look
#   - nwg-displays
#   - qt5ct
#   - qt6ct
#
# Cursor Theme:
#   - bibata-cursors (Bibata-Modern-Ice)
#
# Fonts:
#   - fira-code (Fira Code Regular, Fira Semibold)
#   - bebas-neue (Bebas Neue Regular)
#
# Network:
#   - networkmanager
#   - nm-connection-editor
#   - blueman
#
# Optional Applications (from custom config):
#   - vesktop (Discord client)
#   - telegram-desktop
#   - steam
#
# Misc:
#   - flatpak (for ml4w apps - may want to replace)
#   - gnome-calculator
#   - pavucontrol
#
# =============================================================================

# -----------------------------------------------------
# COLOR DEFINITIONS
# -----------------------------------------------------

$background = rgba(121318ff)
$error = rgba(ffb4abff)
$error_container = rgba(93000aff)
$inverse_on_surface = rgba(303036ff)
$inverse_primary = rgba(4f5b92ff)
$inverse_surface = rgba(e3e1e9ff)
$on_background = rgba(e3e1e9ff)
$on_error = rgba(690005ff)
$on_error_container = rgba(ffdad6ff)
$on_primary = rgba(202c61ff)
$on_primary_container = rgba(dde1ffff)
$on_primary_fixed = rgba(07164bff)
$on_primary_fixed_variant = rgba(374379ff)
$on_secondary = rgba(2c2f42ff)
$on_secondary_container = rgba(dfe1f9ff)
$on_secondary_fixed = rgba(171b2cff)
$on_secondary_fixed_variant = rgba(424659ff)
$on_surface = rgba(e3e1e9ff)
$on_surface_variant = rgba(c6c5d0ff)
$on_tertiary = rgba(44273fff)
$on_tertiary_container = rgba(ffd7f3ff)
$on_tertiary_fixed = rgba(2c1229ff)
$on_tertiary_fixed_variant = rgba(5c3d56ff)
$outline = rgba(90909aff)
$outline_variant = rgba(45464fff)
$primary = rgba(b8c3ffff)
$primary_container = rgba(374379ff)
$primary_fixed = rgba(dde1ffff)
$primary_fixed_dim = rgba(b8c3ffff)
$scrim = rgba(000000ff)
$secondary = rgba(c3c5ddff)
$secondary_container = rgba(424659ff)
$secondary_fixed = rgba(dfe1f9ff)
$secondary_fixed_dim = rgba(c3c5ddff)
$shadow = rgba(000000ff)
$source_color = rgba(6d80d5ff)
$surface = rgba(121318ff)
$surface_bright = rgba(38393fff)
$surface_container = rgba(1f1f25ff)
$surface_container_high = rgba(292a2fff)
$surface_container_highest = rgba(34343aff)
$surface_container_low = rgba(1b1b21ff)
$surface_container_lowest = rgba(0d0e13ff)
$surface_dim = rgba(121318ff)
$surface_tint = rgba(b8c3ffff)
$surface_variant = rgba(45464fff)
$tertiary = rgba(e4bad9ff)
$tertiary_container = rgba(5c3d56ff)
$tertiary_fixed = rgba(ffd7f3ff)
$tertiary_fixed_dim = rgba(e4bad9ff)

# Border colors derived from theme
$color8 = $primary
$color11 = $on_surface

# -----------------------------------------------------
# MONITOR CONFIGURATION
# -----------------------------------------------------

monitor=DP-2,3440x1440@144,0x0,1
monitor=DP-3,1920x1080@100,3440x0,1,transform,3
#monitor=HDMI-A-1,3840x2160@60,-3840x0,1
#monitor=HDMI-A-1,disable

workspace=1,monitor:DP-2
workspace=2,monitor:DP-2
workspace=3,monitor:DP-2
workspace=4,monitor:DP-2
workspace=5,monitor:DP-2
workspace=6,monitor:DP-2
workspace=7,monitor:DP-3
workspace=8,monitor:DP-3
workspace=9,monitor:DP-3
workspace=10,monitor:HDMI-A-1

# -----------------------------------------------------
# CURSOR
# -----------------------------------------------------

exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# -----------------------------------------------------
# ENVIRONMENT VARIABLES
# -----------------------------------------------------

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Cursor size
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Ozone (Electron apps)
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# SDL
env = SDL_VIDEODRIVER,wayland

# -----------------------------------------------------
# INPUT / KEYBOARD
# -----------------------------------------------------

input {
    kb_layout = us,ua
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    numlock_by_default = true
    follow_mouse = 1
    mouse_refocus=false
    touchpad {
        natural_scroll = false
        scroll_factor = 1.0
    }
    sensitivity = 0
}

# -----------------------------------------------------
# AUTOSTART
# -----------------------------------------------------

# Portal activation
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Listeners (ML4W specific - may need replacement)
exec-once=~/.config/ml4w/listeners.sh --startall

# Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Wallpaper
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Notification daemon
exec-once = swaync

# GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Idle daemon
exec-once = hypridle

# Clipboard history
exec-once = wl-paste --watch cliphist store

# ML4W autostart (may need replacement)
exec-once = ~/.config/ml4w/scripts/ml4w-autostart.sh

# Cleanup script
exec-once = ~/.config/hypr/scripts/cleanup.sh

# ML4W Hyprland Settings (may need replacement)
exec = ~/.config/com.ml4w.hyprlandsettings/hyprctl.sh

# Custom: Disable TV on startup
exec-once = sleep 2 && /home/maksym/dotfiles/.scripts/disable-tv.sh

# -----------------------------------------------------
# GENERAL WINDOW SETTINGS
# -----------------------------------------------------

general {
    gaps_in = 10
    gaps_out = 20
    border_size = 2
    col.active_border = $color11
    col.inactive_border = $color8
    layout = dwindle
    resize_on_border = true
}

# -----------------------------------------------------
# DECORATION
# -----------------------------------------------------

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 2
        color = 0x33000000
    }
}

# Waybar blur
layerrule {
  name = layerrule-1
  blur = on
  match:namespace = waybar
}

# -----------------------------------------------------
# ANIMATIONS
# -----------------------------------------------------

animations {
    enabled = true

    # Animation curves
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1

    # Animation configs
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 4.5, menu_accel
    animation = workspaces, 1, 7, menu_decel, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

# -----------------------------------------------------
# LAYOUTS
# -----------------------------------------------------

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    # new_status = master
}

binds {
    workspace_back_and_forth = false
    allow_workspace_cycles = true
    pass_mouse_when_bound = false
}

# -----------------------------------------------------
# MISC
# -----------------------------------------------------

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    initial_workspace_tracking = 1
}

# -----------------------------------------------------
# XWAYLAND
# -----------------------------------------------------

xwayland {
    force_zero_scaling = true
}

# -----------------------------------------------------
# KEY BINDINGS
# -----------------------------------------------------

$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts
$SCRIPTS = ~/.config/ml4w/scripts

# Applications
bind = $mainMod, RETURN, exec, ~/.config/ml4w/settings/terminal.sh
bind = $mainMod, B, exec, ~/.config/ml4w/settings/browser.sh
bind = $mainMod, E, exec, ~/.config/ml4w/settings/filemanager.sh
bind = $mainMod CTRL, E, exec, ~/.config/ml4w/settings/emojipicker.sh
bind = $mainMod CTRL, C, exec, ~/.config/ml4w/settings/calculator.sh

# Display zoom
bind = $mainMod SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}")
bind = $mainMod SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}")
bind = $mainMod SHIFT, Z, exec, hyprctl keyword cursor:zoom_factor 1

# Windows
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, T, workspaceopt, allfloat
bind = $mainMod, J, togglesplit
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, down, resizeactive, 0 100
bind = $mainMod SHIFT, up, resizeactive, 0 -100
bind = $mainMod, G, togglegroup
bind = $mainMod, K, swapsplit
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d
binde = ALT,Tab,cyclenext
binde = ALT,Tab,bringactivetotop

# Actions
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod SHIFT, A, exec, $HYPRSCRIPTS/toggle-animations.sh
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh
bind = $mainMod ALT, F, exec, $HYPRSCRIPTS/screenshot.sh --instant
bind = $mainMod ALT, S, exec, $HYPRSCRIPTS/screenshot.sh --instant-area
bind = $mainMod CTRL, Q, exec, ~/.config/ml4w/scripts/wlogout.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/waypaper.sh --random
bind = $mainMod CTRL, W, exec, ~/.config/hypr/scripts/waypaper.sh
bind = $mainMod ALT, W, exec, $HYPRSCRIPTS/wallpaper-automation.sh
bind = $mainMod CTRL, RETURN, exec, pkill rofi || rofi -show drun -replace -i
bind = $mainMod CTRL, K, exec, $HYPRSCRIPTS/keybindings.sh
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh
bind = $mainMod CTRL, B, exec, ~/.config/waybar/toggle.sh
bind = $mainMod SHIFT, R, exec, $HYPRSCRIPTS/loadconfig.sh
bind = $mainMod, V, exec, $SCRIPTS/cliphist.sh
bind = $mainMod CTRL, T, exec, ~/.config/waybar/themeswitcher.sh
bind = $mainMod CTRL, S, exec, flatpak run com.ml4w.settings
bind = $mainMod ALT, G, exec, $HYPRSCRIPTS/gamemode.sh
bind = $mainMod CTRL, L, exec, ~/.config/hypr/scripts/power.sh lock
bind = $mainMod SHIFT, H, exec, $HYPRSCRIPTS/hyprshade.sh
bind = CTRL, Tab, exec, ~/.config/ml4w/scripts/focus.sh

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, Tab, workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1

bind = $mainMod CTRL, 1, exec, $HYPRSCRIPTS/moveTo.sh 1
bind = $mainMod CTRL, 2, exec, $HYPRSCRIPTS/moveTo.sh 2
bind = $mainMod CTRL, 3, exec, $HYPRSCRIPTS/moveTo.sh 3
bind = $mainMod CTRL, 4, exec, $HYPRSCRIPTS/moveTo.sh 4
bind = $mainMod CTRL, 5, exec, $HYPRSCRIPTS/moveTo.sh 5
bind = $mainMod CTRL, 6, exec, $HYPRSCRIPTS/moveTo.sh 6
bind = $mainMod CTRL, 7, exec, $HYPRSCRIPTS/moveTo.sh 7
bind = $mainMod CTRL, 8, exec, $HYPRSCRIPTS/moveTo.sh 8
bind = $mainMod CTRL, 9, exec, $HYPRSCRIPTS/moveTo.sh 9
bind = $mainMod CTRL, 0, exec, $HYPRSCRIPTS/moveTo.sh 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod CTRL, down, workspace, empty

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86Calculator, exec, ~/.config/ml4w/settings/calculator.sh
bind = , XF86Lock, exec, hyprlock
bind = , XF86Tools, exec, flatpak run com.ml4w.settings

# Keyboard backlight
bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-

# Custom application shortcuts
bind = $mainMod, d, exec, vesktop
bind = $mainMod, l, exec, Telegram
bind = $mainMod, s, exec, steam
bind = $mainMod CTRL, 113, changegroupactive,f
bind = $mainMod CTRL, 114, changegroupactive,b

# Custom media keys
bind = , 201, exec, /home/maksym/dotfiles/.scripts/toggle-audio.sh
bind = , 202, exec, /home/maksym/dotfiles/.scripts/toggle-mute.sh
bind = , 197, exec, /home/maksym/dotfiles/.scripts/toggle-mute-zen.sh
bind = , 195, exec, /home/maksym/dotfiles/.scripts/dec-volume-zen.sh
bind = , 196, exec, /home/maksym/dotfiles/.scripts/inc-volume-zen.sh
bind = , 193, exec, /home/maksym/dotfiles/.scripts/enable-tv.sh
bind = , 194, exec, /home/maksym/dotfiles/.scripts/disable-tv.sh

# Screenshot (custom override)
bind = , PRINT, exec, $HYPRSCRIPTS/screenshot.sh --instant-area-copy

# -----------------------------------------------------
# LAYER RULES (SwayNC)
# -----------------------------------------------------

layerrule2 = blur, swaync-control-center
layerrule2 = blur, swaync-notification-window
layerrule2 = ignorezero, swaync-control-center
layerrule2 = ignorezero, swaync-notification-window
layerrule2 = ignorealpha 0.5, swaync-control-center
layerrule2 = ignorealpha 0.5, swaync-notification-window

# -----------------------------------------------------
# WINDOW RULES
# -----------------------------------------------------

# Pavucontrol
windowrule {
    name = pavucontrol
    match:class = (.*org.pulseaudio.pavucontrol.*)
    float = true
    center = true
    pin = true
    size = 700 600
}

# Waypaper
windowrule {
    name = waypaper
    match:class = (.*waypaper.*)
    float = true
    center = true
    pin = true
    size = 900 700
}

# Newelle
windowrule {
    name = newelle
    match:class = (io.github.qwersyk.Newelle)
    float = true
    center = true
    pin = true
    size = 1000 700
}

# ML4W Calendar
windowrule {
    name = ml4w-calendar
    match:class = (com.ml4w.calendar)
    float = true
    move = monitor_w-window_w-18 85
    pin = true
    size = 400 400
}

# ML4W Sidebar
windowrule {
    name = ml4w-sidebar
    match:class = (com.ml4w.sidebar)
    float = true
    move = monitor_w-window_w-18 91
    pin = true
    size = 400 660
}

# ML4W Welcome
windowrule {
    name = ml4w-welcome
    match:class = (com.ml4w.welcome)
    float = true
    center = true
    pin = true
    size = 700 600
}

# ML4W Settings
windowrule {
    name = ml4w-settings
    match:class = (com.ml4w.settings)
    float = true
    center = true
    pin = true
    size = 800 600
}

# Blueman Manager
windowrule {
    name = blueman-manager
    match:class = (blueman-manager)
    float = true
    center = true
    size = 800 600
}

# nwg-look
windowrule {
    name = nwg-look
    match:class = (nwg-look)
    float = true
    center = true
    size = 700 600
}

# nwg-displays
windowrule {
    name = nwg-displays
    match:class = (nwg-displays)
    float = true
    center = true
    size = 900 600
}

# System Mission Center
windowrule {
    name = missioncenter
    match:class = (io.missioncenter.MissionCenter)
    float = true
    center = true
    pin = true
    size = 900 600
}

# Gnome Calculator
windowrule {
    name = gnome-calculator
    match:class = (org.gnome.Calculator)
    float = true
    center = true
    size = 700 600
}

# Hyprland Share Picker
windowrule {
    name = hyprland-share-picker
    match:class = (hyprland-share-picker)
    float = true
    pin = true
    center = true
    size = 600 400
}

# nm-connection-editor
windowrule {
    name = nm-connection-editor
    match:class = (nm-connection-editor)
    float = true
    center = true
    size = 800 700
}

# Picture-in-Picture
windowrule {
    name = Picture-in-Picture
    match:class = (Picture-in-Picture)
    float = true
    pin = true
    center = true
}

# General floating
windowrule {
    name = dotfiles-floating
    match:class = (dotfiles-floating)
    float = true
    center = true
    size = 1000 700
}

# Dotfiles Sidepad
windowrule {
    name = dotfiles-sidepad
    match:class = (dotfiles-sidepad)
    float = true
    pin = true
    center = true
    size = 1000 700
}

# Steam Big Picture
windowrule = workspace 10, tile on, fullscreen on, match:class ^steam$, match:title .*Big Picture.*
windowrule = fullscreen_state 2 2, match:class ^steam$, match:title .* Big Picture.*

# Steam windows
windowrule = float on, match:class steam
windowrule = tile on, match:class steam, match:title Steam

# Bitwarden
windowrule = float on, match:title .*Bitwarden Password Manager.*


